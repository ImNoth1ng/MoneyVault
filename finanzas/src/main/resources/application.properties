
# ===========================
# Server Configuration
# ===========================
server.port=8085
spring.application.name=finanzas-api

# ===========================
# Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/finanzas_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA/Hibernate Configuration
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===========================
# JWT Configuration
# ===========================
app.jwt.secret=${JWT_SECRET:PPp27xSTfBwOpRn4/AV6gPzQSnQg+Oi80KdWfCcuAHs=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===========================
# Logging Configuration
# ===========================
logging.level.root=INFO
logging.level.com.nth.finanzas=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===========================
# Error Response Detail (Development)
# ===========================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# ===========================
# File Upload Configuration
# ===========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
